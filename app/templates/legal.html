{% extends "base.html" %}
{% block title %}{{ heading }} · Leakproof{% endblock %}
{% block content %}
<article class="prose mx-auto max-w-3xl text-zinc-300">
  <h1 class="text-2xl font-semibold text-zinc-50">{{ heading }}</h1>
  <p class="mt-1 text-xs text-zinc-500">Last updated 2026-10-23</p>
  {% for h, body in sections %}
  <h2 class="mt-8 text-lg font-semibold text-zinc-100">{{ h }}</h2>
  <p class="mt-2 text-sm leading-relaxed">{{ body }}</p>
  {% endfor %}
  <p class="mt-10 text-xs text-zinc-500">Questions: hello@leakproof.dev</p>
</article>
{% endblock %}
