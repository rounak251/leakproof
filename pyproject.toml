[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leakproof-audit"
version = "0.1.0"
description = "Catch data leakage, label noise and broken CV splits before you train."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Rounak Choudhary" }]
keywords = ["machine-learning", "data-leakage", "validation", "kaggle", "mlops", "data-quality"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "jinja2>=3.1",
]

[project.optional-dependencies]
narrative = ["anthropic>=0.40"]
formats = ["pyarrow>=14", "openpyxl>=3.1"]
server = [
  "fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9", "sqlalchemy>=2.0",
  "itsdangerous>=2.1", "bcrypt>=4.0", "stripe>=8.0", "anthropic>=0.40", "pyarrow>=14", "openpyxl>=3.1",
]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
leakproof = "leakproof.cli:main"

[project.urls]
Homepage = "https://leakproof.dev"

[tool.setuptools.packages.find]
include = ["leakproof*"]

[tool.setuptools.package-data]
leakproof = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
