# Example for customers: fail a pull request when training code fits anything on test rows.
name: leakproof lint
on:
  pull_request:
    paths: ["**/*.py", "**/*.ipynb"]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "git+https://github.com/rounak251/leakproof"
      - run: leakproof lint $(git ls-files '*.py' '*.ipynb') --fail-on error --no-repro
